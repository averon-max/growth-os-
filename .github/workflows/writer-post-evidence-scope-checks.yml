name: Post-evidence scope reconciliation checks

on:
  push:
    branches:
      - fix/writer-post-evidence-scope-20261018
      - cleanup/remove-unwired-content-20261018
      - refactor/content-runtime-consolidation-20261018
      - refactor/content-single-writer-only-20261018
      - refactor/content-remove-legacy-outline-scope-20261018
      - refactor/content-evidence-recovery-observability-20261018
      - cleanup/content-retire-oneoff-article-rescues-20261019
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://runner:runner@127.0.0.1:5432/growth_os_ci
      NEXTAUTH_SECRET: offline-ci-secret-do-not-deploy
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies and generate Prisma client
        run: npm ci --no-audit --no-fund
      - name: Audit production versus script-only Content modules
        run: |
          node scripts/writer-module-map.mjs > /dev/null
          node - <<'JS'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('.growth-os-tmp/writer-module-map.json','utf8'));
          const xs=a.contentProduction;
          const scriptOnly=xs.filter(x=>!x.inRuntimeGraph&&x.inScriptGraph);
          console.log('SCRIPT_ONLY_CONTENT_MODULES',JSON.stringify(scriptOnly.map(x=>({
            path:x.path,lines:x.lines,script:x.directOtherImporters,
            test:x.directTestImporters,dependencies:x.internalContentDependencies,
          })),null,2));
          const testOnly = xs.filter(x => !x.inRuntimeGraph && !x.inScriptGraph);
          console.log('TEST_ONLY_CONTENT_MODULES', JSON.stringify(testOnly.map(x => ({
            path: x.path, lines: x.lines,
            productionImporters: x.directProductionImporters,
            testImporters: x.directTestImporters,
          }))));
          console.log('REACHABLE_WRITER_ONLY',xs.filter(x=>x.inWriterGraph).length);
          console.log('RUNTIME_NOT_WRITER',xs.filter(x=>x.inRuntimeGraph&&!x.inWriterGraph).length);
          JS
      - name: No legacy evidence scope owner after Plan lock
        run: |
          node - <<'JS'
          const fs=require("fs");
          const content=fs.readFileSync("src/lib/content/service.ts","utf8");
          if(/\b(?:buildEvidenceAwareOutline|resolveEvidenceDeferredMasterScopeV1|articleOutlinePlan)\b/.test(content)) throw Error("LEGACY_SCOPE_RESOLVER_PRESENT");
          if(!content.includes('article.locked_evidence_scope'))throw Error("LOCKED_SCOPE_TRACE_MISSING");
          const graph=JSON.parse(fs.readFileSync(".growth-os-tmp/writer-module-map.json","utf8"));
          for(const name of ["evidence-deferred-master-scope.ts","evidence-aware-planning.ts"]) {
            const x=graph.contentProduction.find(x=>x.path.endsWith("/"+name));
            console.log("LEGACY_MODULE_REACHABILITY",JSON.stringify({name,runtime:x?.inRuntimeGraph,writer:x?.inWriterGraph,productionImporters:x?.directProductionImporters,scriptImporters:x?.directOtherImporters,testImporters:x?.directTestImporters}));
          }
          JS
      - name: Reviewed deletion gate
        run: node scripts/repository-deletion-gate.mjs --check
      - name: Confirm six legacy Content quality files are deleted
        run: |
          test ! -e src/lib/content/quality-improvement-editorial-recovery-v1.ts
          test ! -e src/lib/content/quality-improvement-h3-v1.ts
          test ! -e src/lib/content/quality-improvement-keyword-original-sentence-v1.ts
          test ! -e src/lib/content/quality-improvement-keyword-recovery-v1.ts
          test ! -e src/lib/content/quality-improvement-post-editorial-depth-v1.ts
          test ! -e src/lib/content/quality-improvement-progress-scope-v1.ts
      - name: Require one Master Writer and forbid full-article fallback
        run: |
          node - <<'JS'
          const fs=require('fs');
          const provider=fs.readFileSync('src/lib/content/openai-generator.ts','utf8');
          const api=fs.readFileSync('src/lib/content/generator.ts','utf8');
          const service=fs.readFileSync('src/lib/content/service.ts','utf8');
          const must=(yes,msg)=>{if(!yes)throw new Error(msg);};
          must(!/async (?:generateArticle|rewriteArticle|critiqueArticle)\s*\(/.test(provider),'legacy full-article model method survived');
          must(!/generateArticle\s*\(/.test(api),'old generateArticle generator contract survived');
          must(!/async generateBrief\s*\(/.test(provider),'legacy duplicate brief generator survived');
          must(!/generator\.generateBrief\s*\(/.test(service),'legacy extra brief model call survived');
          must(service.includes('deriveBriefOutlineFromExecutionPlanV1'),'Master-driven brief outline missing');
          must(/generateArticleShell\s*\(/.test(provider),'Master shell generator missing');
          must(/generateSection\s*\(/.test(provider),'Master section generator missing');
          must(/executeMasterWriterV1\s*\(/.test(service),'real Master Writer disconnected');
          must(service.includes('assertCanonicalWriterPreflightV1'),'canonical evidence preflight disconnected');
          must(service.includes('withWriterTraceV1'),'trace scope disconnected');
          console.log('SINGLE_MASTER_WRITER_WITH_PREFLIGHT_AND_TRACE_PASS');
          JS
      - name: No secondary strategy prompt
        run: |
          test ! -e src/lib/content/content-strategy-prompt-v1.ts
          test ! -e src/lib/content/content-strategy-prompt-v1.test.ts
      - name: Recovery observability invariant
        run: |
          node - <<'JS'
          const fs = require('fs');
          const source = fs.readFileSync('src/lib/content/production-master-live-stage-planner.ts','utf8');
          for (const stage of ['research.evidence_recovery.wave','research.evidence_recovery.summary','research.evidence_recovery.question_probe']) {
            if (!source.includes(stage)) throw new Error('MISSING_TRACE_STAGE:' + stage);
          }
          if ((source.match(/await callContentAiJson\(/g) || []).length !== 5) throw new Error('UNEXPECTED_PAID_PLANNER_CALLS');
          if (!source.includes('Math.min(MAX_EVIDENCE_RECOVERY_WAVES_V1, recoveryQuerySuffixes.length)')) {
            throw new Error('UNBOUNDED_EVIDENCE_QUERY_EXPANSION');
          }
          console.log('EVIDENCE_RECOVERY_BOUNDED_TRACE_PASS');
          JS
      - name: No one-off credit-article code in Content runtime
        run: |
          node - <<'JS'
          const fs=require("node:fs");
          const retired=[
            "src/lib/content/score-impact-closure-preview-v1.ts",
            "src/lib/content/score-impact-closure-preview-v1.test.ts",
            "scripts/content-article-final-closure-preview.ts",
            "src/lib/content/article-question-gap-audit-v1.ts",
            "src/lib/content/article-question-gap-audit-v1.test.ts",
            "scripts/content-existing-article-question-gap-audit.ts",
            "src/lib/content/rebind-approved-direct-answer-v1.ts",
            "src/lib/content/rebind-approved-direct-answer-v1.test.ts",
            "scripts/rebind-approved-direct-answer-v1.ts",
          ];
          for (const file of retired) if(fs.existsSync(file)) throw Error("RETIRED_FILE_PRESENT:"+file);
          const c=fs.readFileSync("src/lib/content/service.ts","utf8");
          const p=fs.readFileSync("src/lib/content/production-master-live-stage-planner.ts","utf8");
          if(!c.includes("assertCanonicalWriterPreflightV1") || !c.includes("executeMasterWriterV1") || !c.includes("withWriterTraceV1"))throw Error("CORE_WRITER_MISSING");
          if(!p.includes("research.evidence_recovery.wave") || !p.includes("resolveSelectedTemplatePolicyV1"))throw Error("CORE_RESEARCH_OR_TEMPLATES_MISSING");
          console.log("NO_ARTICLE_SPECIFIC_CONTENT_REWRITE_CLEANUP_PASS");
          JS
      - name: TypeScript strict
        run: npx tsc --noEmit
      - name: All Content and Keyword regressions
        run: npx vitest run src/lib/content src/lib/keywords
      - name: Read-only trace report tests
        run: node --test scripts/writer-trace-report.test.mjs
      - name: Next.js production build
        run: npm run build
      - name: Safety assertion
        run: echo "NO_PAID_MODEL_NO_SERP_API_NO_DATABASE_MUTATION_NO_PUBLICATION"
