name: Canonical Writer and diagnostics verification

on:
  push:
    branches:
      - feat/writer-unified-preflight-trace-20261018
      - fix/writer-single-log-template-observability-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  writer-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://runner:runner@127.0.0.1:5432/growth_os_ci
      NEXTAUTH_SECRET: ci-only-diagnostic-secret
      NEXTAUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install and Prisma codegen
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript
        run: npx tsc --noEmit
      - name: Canonical Writer, template, research, and trace regression
        run: npx vitest run src/lib/content src/lib/keywords
      - name: Trace report privacy and diagnosis checks
        run: node --test scripts/writer-trace-report.test.mjs
      - name: Production build smoke
        run: npm run build
      - name: Confirm no paid or DB mutations
        run: echo "OFFLINE_ONLY; PAID_PROVIDER_CALLS=0; LOCAL_SIGNAL_DB_UNCHANGED"
