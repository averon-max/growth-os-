      - "scripts/content-existing-article-research-recovery-live.ts"
      - "scripts/content-existing-article-research-evidence-diagnose.ts"
      - "src/lib/content/research-diagnosis-cli-source-v1.test.ts"
      - "src/lib/content/content-topic-typo-guard-v1.ts"
