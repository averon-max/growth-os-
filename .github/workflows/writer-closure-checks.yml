      - "src/app/dashboard/content/articles/[id]/page.tsx"
      - "src/app/api/content/articles/[id]/approve/route.ts"
      - "src/app/api/content/articles/[id]/publish/route.ts"
      - "src/lib/content/existing-article-quality-improvement-v1.ts"
      - "src/lib/content/verified-archived-writer-run-v1.ts"
      - "src/lib/content/verified-archived-writer-run-v1.test.ts"
      - "scripts/content-improve-existing-article-quality.ts"
      - "src/lib/content/quality-improvement-progress-scope-v1.ts"
      - "src/lib/content/quality-improvement-progress-scope-v1.test.ts"
      - "src/lib/content/quality-improvement-h3-v1.ts"
      - "src/lib/content/quality-improvement-h3-v1.test.ts"
      - "src/lib/content/master-section-repair-prompt.ts"
      - "src/lib/content/quality-improvement-editorial-recovery-v1.ts"
